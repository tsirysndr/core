[package]
name = "shuttle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
nix = { version = "0.31", features = ["fs", "process", "reboot", "signal", "user"] }
prost = "0.14"
prost-reflect = "0.16"
prost-protovalidate = "0.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { workspace = true, features = ["fs", "net", "process"] }
tokio-vsock = "0.7.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
