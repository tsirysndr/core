{{ define "timeline/fragments/welcome" }}
  <div class="border border-gray-200 dark:border-gray-700 rounded-sm divide-y divide-gray-200 dark:divide-gray-700">
    <div class="flex items-center justify-between bg-white/50 dark:bg-gray-800/50">
      <h3 class="text-base dark:text-white flex items-center gap-2 px-4 py-2">
        {{ i "sparkle" "size-4 flex-shrink-0" }}
        Welcome
      </h3>
      <a href="/welcome" class="text-sm font-normal flex items-center gap-1 pr-4 text-gray-500 dark:text-gray-400 no-underline hover:no-underline">
        Continue {{ i "arrow-right" "size-3.5" }}
      </a>
    </div>
    <div class="flex flex-col gap-3 px-4 py-3 bg-white dark:bg-gray-800">
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Continue where you left off to finish setting up your account.
      </p>
      {{ template "onboarding/progressBar" .Onboarding }}
    </div>
  </div>
{{ end }}
