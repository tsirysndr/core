{{ define "timeline/fragments/newsletterWidget" }}
<div
  id="newsletter-widget"
  class="relative border border-green-800/15 dark:border-green-700 rounded bg-green-50 dark:bg-green-950 p-4">
  <button
    type="button"
    data-newsletter-dismiss
    class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 dark:hover:text-gray-200 leading-none text-sm"
    aria-label="Dismiss">
    ✕
  </button>
  <p class="text-green-900 dark:text-green-300 pr-6 mb-3">
    We've got a newsletter!
    <br />
    Punch in your email to subscribe.
  </p>
  {{ template "timeline/fragments/newsletterForm" (dict "Id" "widget" "Variant" "card") }}
</div>
{{ end }}
