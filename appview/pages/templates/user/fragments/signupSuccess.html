{{ define "user/fragments/signupSuccess" }}
  <main
      id="main"
      hx-swap-oob="outerHTML"
      class="w-full max-w-md px-7 mt-4 flex flex-col items-center gap-4 text-center"
  >
    <div class="flex items-center justify-center size-16 rounded-full bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400">
      {{ i "check" "size-8" }}
    </div>
    <p class="text-lg dark:text-white">Account created successfully</p>
    <a
        href="/login?handle={{ .Handle }}"
        class="btn-create w-full text-base hover:no-underline hover:text-white inline-flex items-center justify-center gap-1"
    >
      Continue to login {{ i "arrow-right" "size-4" }}
    </a>
  </main>
{{ end }}
