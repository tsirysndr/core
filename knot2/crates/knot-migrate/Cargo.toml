[package]
name = "knot-migrate"
version = "2.0.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[[bin]]
name = "knot-migrate"
path = "src/main.rs"

[dependencies]
knot-types = { workspace = true }
knot-runtime = { workspace = true }
knot-git = { workspace = true }
knot-cob = { workspace = true }
knot-cobs = { workspace = true }
knot-config = { workspace = true }
knot-secrets = { workspace = true }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { workspace = true, features = ["fs"] }
ssh-key = { version = "0.7.0-rc.10", default-features = false, features = ["std", "ed25519", "ecdsa"] }
chrono = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
knot-index = { workspace = true }
tempfile = { workspace = true }
