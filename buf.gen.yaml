version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=import
      - module=tangled.org/core
  - local: protoc-gen-prost
    out: shuttle/src/gen
    opt:
      - bytes=.
    # we dont need fleet types in rust code since nothing uses it
    exclude_types:
      - spindle.mill.v1
