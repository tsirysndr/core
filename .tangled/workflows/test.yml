when:
  - event: ["push", "pull_request"]
    branch: master

engine: microvm
image: nixos

dependencies:
  - go
  - gcc

environment:
  CGO_ENABLED: 1

steps:
  - name: patch static dir
    command: |
      mkdir -p appview/pages/static; touch appview/pages/static/x

  - name: run linter
    command: |
      go vet -v ./...

  - name: run all tests
    command: |
      go test -v ./...
