when:
  - event: push
    branch: master
    paths:
      - blog/**
      - cmd/blog/**

engine: microvm
image: nixos

dependencies:
  - nodejs

steps:
  - name: build blog
    command: |
      nix build .#blog --impure

  - name: deploy
    command: |
      npx --yes wrangler pages deploy --branch master --project-name tangled-blog ./result
