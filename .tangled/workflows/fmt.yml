when:
  - event: ["push", "pull_request"]
    branch: master

engine: microvm
image: alpine

steps:
  - name: "Check formatting"
    command: |
      mkdir -p bobbin/crates/types/src/_lex
      [ -f bobbin/crates/types/src/_lex/lib.rs ] || : > bobbin/crates/types/src/_lex/lib.rs
      nix fmt -- --ci
